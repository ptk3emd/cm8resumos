name: Static app smoke tests (desktop + emulated mobile)
on:
  pull_request:
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "assets/**"
      - "schema/**"
      - "tests/**"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/site-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
